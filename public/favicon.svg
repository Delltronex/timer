<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle with glow -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Inner border highlight -->
  <rect x="7" y="7" width="86" height="86" rx="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Hourglass / Clock symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hourglass shape -->
    <path d="M 31 28 L 69 28 L 54 50 L 69 72 L 31 72 L 46 50 Z" />
    <!-- Sand flow dot / pulse -->
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" stroke="none" />
    <path d="M 37 34 L 63 34" stroke-width="3.5" opacity="0.6" />
    <path d="M 40 66 L 60 66" stroke-width="3.5" opacity="0.8" fill="#ffffff" />
  </g>
</svg>